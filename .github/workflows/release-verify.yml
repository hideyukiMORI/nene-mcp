name: Release verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to verify (e.g. 0.1.3)'
        required: true

permissions:
  contents: read

jobs:
  packagist-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Resolve version
        id: ver
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for Packagist mirror (retry)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x tools/packagist-verify.sh
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i..."
            if tools/packagist-verify.sh "$VERSION"; then
              exit 0
            fi
            sleep 30
          done
          echo "Packagist verify failed after retries" >&2
          exit 1
