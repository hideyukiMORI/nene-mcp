name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer test
      - name: FT regression smoke (fixture catalog)
        run: |
          chmod +x tools/ft-runner.sh
          tools/ft-runner.sh write-failclosed /tmp/ci-ft9
          tools/ft-runner.sh security-catalog /tmp/ci-ft6
