name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v4

      # Dependency-vulnerability gate. Kept as its own step rather than folded into
      # `composer check`, so the job log (and any cross-repo tooling that reads it)
      # can tell whether the audit ran at all. A check that leaves no trace cannot be
      # distinguished from a check that is missing.
      - name: composer audit
        run: composer audit --no-interaction
      - run: composer check
      - name: FT regression smoke (fixture catalog)
        run: |
          chmod +x tools/ft-runner.sh
          tools/ft-runner.sh write-failclosed /tmp/ci-ft9
          tools/ft-runner.sh security-catalog /tmp/ci-ft6
